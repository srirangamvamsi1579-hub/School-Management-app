<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Teacher app attendance</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F6F8; font-family: Inter, system-ui, sans-serif; color: #14171C; display: flex; flex-direction: column; overflow: hidden">
  <header style="padding: 24px 20px 12px; display: flex; flex-direction: column; gap: 12px; background: #FFFFFF; border-bottom: 1px solid #E3E6EB">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 13px; color: #4B5260">Mon, 16 Nov · Grade 8-B</span>
        <h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700">Attendance</h1>
      </div>
      <button type="button" onClick="{{allPresent}}" style="min-height: 40px; padding: 0 12px; border: 1px solid #CDD2DA; border-radius: 10px; background: #FFFFFF; font: inherit; font-size: 13px; font-weight: 600">All present</button>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <div style="padding: 8px 10px; border-radius: 10px; background: #E6F4EA"><div style="font-size: 11px; color: #0F6B32; font-weight: 600">Present</div><div style="font-size: 18px; font-weight: 700; color: #0F6B32">{{pCount}}</div></div>
      <div style="padding: 8px 10px; border-radius: 10px; background: #FDECEA"><div style="font-size: 11px; color: #A11A12; font-weight: 600">Absent</div><div style="font-size: 18px; font-weight: 700; color: #A11A12">{{aCount}}</div></div>
      <div style="padding: 8px 10px; border-radius: 10px; background: #FFF1E0"><div style="font-size: 11px; color: #8A3B00; font-weight: 600">Late / leave</div><div style="font-size: 18px; font-weight: 700; color: #8A3B00">{{lCount}}</div></div>
    </div>
  </header>

  <ul aria-label="Students" style="flex: 1; overflow: hidden; margin: 0; padding: 8px 16px; list-style: none; display: flex; flex-direction: column; gap: 8px">
    <sc-for list="{{kids}}" as="k" hint-placeholder-count="8">
      <li style="display: flex; align-items: center; gap: 10px; padding: 8px 10px; background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 12px">
        <span style="width: 28px; font-size: 12px; color: #4B5260; font-weight: 600">{{k.roll}}</span>
        <span style="flex: 1; font-size: 14px; font-weight: 600">{{k.name}}</span>
        <div role="group" aria-label="{{k.aria}}" style="display: flex; gap: 4px">
          <sc-for list="{{k.opts}}" as="o" hint-placeholder-count="3">
            <button type="button" onClick="{{o.pick}}" aria-pressed="{{o.pressed}}" aria-label="{{o.aria}}" style="width: 44px; height: 44px; border-radius: 10px; font: inherit; font-size: 14px; font-weight: 700; border: 1px solid {{o.border}}; background: {{o.bg}}; color: {{o.fg}}">{{o.label}}</button>
          </sc-for>
        </div>
      </li>
    </sc-for>
    <li style="text-align: center; font-size: 12px; color: #4B5260; padding: 4px">Showing 8 of 38 · scroll for more</li>
  </ul>

  <div style="padding: 10px 16px; background: #FFFFFF; border-top: 1px solid #E3E6EB">
    <button type="button" style="width: 100%; min-height: 52px; border: 0; border-radius: 12px; background: #2147C7; color: #FFFFFF; font: inherit; font-size: 16px; font-weight: 700">Submit &amp; notify absent parents</button>
  </div>
  <nav aria-label="Teacher app" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: #FFFFFF; padding: 4px 8px 22px">
    <sc-for list="{{tabs}}" as="b" hint-placeholder-count="4">
      <a href="#" aria-current="{{b.cur}}" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 52px; justify-content: center; text-decoration: none; font-size: 11px; font-weight: 600; color: {{b.fg}}">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{b.icon}}"></path></svg>
        {{b.label}}
      </a>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const names = ['Aditi Kulkarni', 'Arjun Nair', 'Diya Patel', 'Farhan Ali', 'Ishaan Gupta', 'Kavya Reddy', 'Neha Joshi', 'Rohan Das'];
    const st = (this.state && this.state.marks) || { 3: 'A', 6: 'L' };
    const C = { P: ['#0F6B32', '#E6F4EA'], A: ['#A11A12', '#FDECEA'], L: ['#8A3B00', '#FFF1E0'] };
    const W = { P: 'present', A: 'absent', L: 'late or on leave' };
    let p = 30, a = 0, l = 0;
    const kids = names.map((name, i) => {
      const cur = st[i] || 'P';
      if (cur === 'P') p += 1; else if (cur === 'A') a += 1; else l += 1;
      return {
        name, roll: String(i + 1).padStart(2, '0'), aria: 'Attendance for ' + name,
        opts: ['P', 'A', 'L'].map((o) => {
          const on = o === cur;
          return { label: o, pressed: on ? 'true' : 'false', aria: 'Mark ' + name + ' ' + W[o], bg: on ? C[o][1] : '#FFFFFF', fg: on ? C[o][0] : '#5B6270', border: on ? C[o][0] : '#DDE1E7',
            pick: () => this.setState({ marks: Object.assign({}, st, { [i]: o }) }) };
        })
      };
    });
    const I = { home: 'M3 11l9-8 9 8M5 10v10h14V10', att: 'M9 11l3 3L22 4M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11', leave: 'M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z', pay: 'M3 6h15a3 3 0 0 1 3 3v9a2 2 0 0 1-2 2H3zM3 6l13-3v3M16 13h2' };
    const tabs = [['Home', I.home, false], ['Attendance', I.att, true], ['Leave', I.leave, false], ['Payslips', I.pay, false]]
      .map(([label, icon, on]) => ({ label, icon, cur: on ? 'page' : 'false', fg: on ? '#2147C7' : '#5B6270' }));
    return { kids, tabs, pCount: String(p), aCount: String(a), lCount: String(l), allPresent: () => this.setState({ marks: {} }) };
  }
}
</script>
</body>
</html>
