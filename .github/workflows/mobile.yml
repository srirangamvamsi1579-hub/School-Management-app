# Builds the store apps. Android on Ubuntu (Android SDK preinstalled), iOS on macOS (Xcode).
# Store uploads run only when the secrets are set and the run is started by hand with "release".
name: Mobile apps
on:
  push:
    branches: [main]
    paths: ['app/**', 'mobile/**', '.github/workflows/mobile.yml']
  workflow_dispatch:
    inputs:
      release:
        description: 'Upload to Play internal testing / TestFlight'
        type: boolean
        default: false

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Unit tests
        run: cd app && npm ci && npm test
      - name: Store-readiness tests (accessibility, touch targets, access rules, deletion, privacy)
        run: |
          cd app && npm run build:mobile && npm run build:single
          npx playwright install --with-deps chromium
          npm run test:store

  android:
    needs: checks
    runs-on: ubuntu-latest
    env:   # secrets cannot be used in step "if:", so expose whether they exist
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      HAS_PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Web build + sync
        run: cd mobile && npm ci && npm run sync
      - name: Check target SDK (Play needs API 36 from 31 Aug 2026)
        run: grep -q "targetSdkVersion = 36" mobile/android/variables.gradle
      - name: Restore upload key
        if: env.HAS_KEY == 'true'
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > $RUNNER_TEMP/upload.jks
      - name: Build app bundle and lint
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
          ANDROID_KEYSTORE_PATH: ${{ env.HAS_KEY == 'true' && format('{0}/upload.jks', runner.temp) || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: cd mobile/android && ./gradlew lintRelease bundleRelease
      - uses: actions/upload-artifact@v4
        with: { name: android-bundle, path: mobile/android/app/build/outputs/bundle/release/*.aab }
      - name: Upload to Play (internal testing)
        if: inputs.release && env.HAS_PLAY == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.yourapp.school
          releaseFiles: mobile/android/app/build/outputs/bundle/release/*.aab
          track: internal

  ios:
    needs: checks
    runs-on: macos-15
    env:
      HAS_ASC: ${{ secrets.APP_STORE_CONNECT_KEY_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Use Xcode 26 (App Store needs the iOS 26 SDK from 28 Apr 2026)
        run: sudo xcode-select -s /Applications/Xcode_26*.app || xcodebuild -version
      - name: Web build + sync
        run: cd mobile && npm ci && npm run sync
      - name: Build for the simulator (no signing) — proves the project compiles
        run: cd mobile/ios/App && xcodebuild -project App.xcodeproj -scheme App -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Archive and upload to TestFlight
        if: inputs.release && env.HAS_ASC == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys && echo "$ASC_KEY" > ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8
          cd mobile/ios/App
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -archivePath $RUNNER_TEMP/App.xcarchive \
            -allowProvisioningUpdates -authenticationKeyID $ASC_KEY_ID -authenticationKeyIssuerID $ASC_ISSUER_ID -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8 \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} MARKETING_VERSION=1.0.${{ github.run_number }} archive
          xcodebuild -exportArchive -archivePath $RUNNER_TEMP/App.xcarchive -exportOptionsPlist ../ExportOptions.plist -exportPath $RUNNER_TEMP/out \
            -allowProvisioningUpdates -authenticationKeyID $ASC_KEY_ID -authenticationKeyIssuerID $ASC_ISSUER_ID -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8
