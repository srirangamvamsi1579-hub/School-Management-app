# Test → dev (automatic) → pre-prod (approval) → prod (approval)
# Set up once in GitHub: Settings → Environments → create dev, preprod, prod;
# add "Required reviewers" to preprod and prod. Add repository secret AWS_DEPLOY_ROLE_ARN
# (an IAM role trusted for GitHub OIDC with CloudFormation, S3 and CloudFront rights),
# then set repository variable AWS_DEPLOY_ENABLED = true. Until then only the test job runs.
name: build-and-deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npm run build && npm run build:single
      - uses: actions/upload-artifact@v4
        with: { name: single-file-build, path: app/dist-single/index.html }

  dev:
    if: github.event_name != 'pull_request' && vars.AWS_DEPLOY_ENABLED == 'true'
    needs: test
    runs-on: ubuntu-latest
    environment: { name: dev, url: '${{ steps.d.outputs.link }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: aws-actions/configure-aws-credentials@v4
        with: { role-to-assume: '${{ secrets.AWS_DEPLOY_ROLE_ARN }}', aws-region: ap-south-1 }
      - id: d
        run: |
          deploy/aws/deploy.sh ${{ github.job }} ap-south-1 | tee out.txt
          echo "link=$(tail -1 out.txt | awk '{print $NF}')" >> "$GITHUB_OUTPUT"

  preprod:
    needs: dev
    runs-on: ubuntu-latest
    environment: { name: preprod, url: '${{ steps.d.outputs.link }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: aws-actions/configure-aws-credentials@v4
        with: { role-to-assume: '${{ secrets.AWS_DEPLOY_ROLE_ARN }}', aws-region: ap-south-1 }
      - id: d
        run: |
          deploy/aws/deploy.sh ${{ github.job }} ap-south-1 | tee out.txt
          echo "link=$(tail -1 out.txt | awk '{print $NF}')" >> "$GITHUB_OUTPUT"

  prod:
    needs: preprod
    runs-on: ubuntu-latest
    environment: { name: prod, url: '${{ steps.d.outputs.link }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: aws-actions/configure-aws-credentials@v4
        with: { role-to-assume: '${{ secrets.AWS_DEPLOY_ROLE_ARN }}', aws-region: ap-south-1 }
      - id: d
        run: |
          deploy/aws/deploy.sh ${{ github.job }} ap-south-1 | tee out.txt
          echo "link=$(tail -1 out.txt | awk '{print $NF}')" >> "$GITHUB_OUTPUT"
